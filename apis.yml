name: MDaaS Global
description: >-
  MDaaS Global builds a modern, technology-powered healthcare network delivering
  affordable diagnostic and imaging services across underserved communities in
  Africa. Through its BeaconHealth Diagnostics clinics and BeaconHealth Affiliate
  Network — supported by the BeaconOS facility operating system and the Medverse
  sample-logistics platform — MDaaS has served 650,000+ patients across 25+
  African cities with 1,300+ clinical partners. Headquartered in Lekki, Lagos,
  Nigeria and backed by Techstars, the company also provides public-health data
  and insights services. This profile was surfaced as a Techstars portfolio
  company and enriched by the API Evangelist pipeline; MDaaS publishes no public
  developer API, SDK, or documentation surface at this time.
